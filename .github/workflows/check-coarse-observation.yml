name: Check approved coarse observation
on:
  push:
    branches: [first-delivery, codex/first-delivery]
    paths:
      - 'prompts/**'
      - 'coarse_observation.py'
      - 'measurement_adapter.py'
      - 'window_selection.py'
      - 'vlm_matching.py'
      - 'evaluate_rollout.py'
      - 'tests/**'
      - '.github/workflows/check-coarse-observation.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Headless wheels avoid the system GUI package installation used in older checks.
      - name: Install CPU dependencies
        timeout-minutes: 3
        run: |
          python -m pip install --disable-pip-version-check --timeout 30 --retries 1 'numpy>=1.26,<3' 'opencv-python-headless>=4.10,<5'
          python -m pip freeze
      - name: Validate observation, all-pairs routing and bounded measurement adapter
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/coarse-observation-tests.txt"
      - name: Save test log and approved prompt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coarse-observation-checks
          path: |
            ${{ runner.temp }}/coarse-observation-tests.txt
            prompts/qwen_coarse_observation.txt
